<!DOCTYPE html>
<html>
<head>
  <title>Study Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Study Planner</h1>

  <input type="text" id="subjectInput" placeholder="New subject (Python, Maths...)">
  <button id="addSubjectBtn">Add Subject</button>

  <div id="subjects"></div>

  <script>
    // Load saved data (or start with an empty list)
    let subjects = JSON.parse(localStorage.getItem("subjects")) || [];

    const subjectInput = document.getElementById("subjectInput");
    const addSubjectBtn = document.getElementById("addSubjectBtn");
    const subjectsBox = document.getElementById("subjects");

    function saveSubjects() {
      localStorage.setItem("subjects", JSON.stringify(subjects));
    }

    function showSubjects() {
      subjectsBox.innerHTML = "";

      for (let i = 0; i < subjects.length; i++) {
        const box = document.createElement("div");

        const title = document.createElement("h3");
        title.innerText = subjects[i].name;
        box.appendChild(title);

        const taskInput = document.createElement("input");
        taskInput.type = "text";
        taskInput.placeholder = "New task";
        box.appendChild(taskInput);

        const addTaskBtn = document.createElement("button");
        addTaskBtn.innerText = "Add Task";
        addTaskBtn.addEventListener("click", function () {
          if (taskInput.value === "") {
            alert("Please enter a task");
            return;
          }
          subjects[i].tasks.push({ text: taskInput.value, done: false });
          saveSubjects();
          showSubjects();
        });
        box.appendChild(addTaskBtn);

        const taskList = document.createElement("ul");
        for (let j = 0; j < subjects[i].tasks.length; j++) {
          const item = document.createElement("li");

          // Tick box
          const tick = document.createElement("input");
          tick.type = "checkbox";
          tick.checked = subjects[i].tasks[j].done;
          tick.addEventListener("change", function () {
            subjects[i].tasks[j].done = tick.checked;
            saveSubjects();
            showSubjects();
          });
          item.appendChild(tick);

          // Task text (line through when done)
          const text = document.createElement("span");
          text.innerText = " " + subjects[i].tasks[j].text + " ";
          if (subjects[i].tasks[j].done) {
            text.style.textDecoration = "line-through";
          }
          item.appendChild(text);

          // Delete button
          const deleteBtn = document.createElement("button");
          deleteBtn.innerText = "Delete";
          deleteBtn.addEventListener("click", function () {
            subjects[i].tasks.splice(j, 1);
            saveSubjects();
            showSubjects();
          });
          item.appendChild(deleteBtn);

          taskList.appendChild(item);
        }
        box.appendChild(taskList);

        subjectsBox.appendChild(box);
      }
    }

    addSubjectBtn.addEventListener("click", function () {
      const name = subjectInput.value;

      if (name === "") {
        alert("Please enter a subject name");
        return;
      }

      subjects.push({ name: name, tasks: [] });
      subjectInput.value = "";
      saveSubjects();
      showSubjects();
    });

    // Show saved data when the page opens
    showSubjects();
  </script>
</body>
</html>
